<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snake (Arrow Keys)</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0f14;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #e7eefc;
    }
    .wrap {
      width: min(520px, 92vw);
      display: grid;
      gap: 12px;
    }
    .top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      backdrop-filter: blur(6px);
    }
    canvas {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #071018;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 16px 48px rgba(0,0,0,0.4);
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <b>Snake</b>
      <div>
        Score: <span id="score">0</span> · Best: <span id="best">0</span>
      </div>
    </div>
    <canvas id="game" width="480" height="480"></canvas>
  </div>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");

  const cells = 24;
  const size = canvas.width / cells;
  const baseSpeed = 8;

  let lastTime = 0;
  let accumulator = 0;
  let paused = false;
  let snake, dir, nextDir, food, score, best;

  best = Number(localStorage.getItem("snake_best") || 0);
  bestEl.textContent = best;

  function randCell() {
    return { x: Math.floor(Math.random() * cells), y: Math.floor(Math.random() * cells) };
  }

  function samePos(a, b) { return a.x === b.x && a.y === b.y; }

  function placeFood() {
    while (true) {
      const p = randCell();
      if (!snake.some(s => samePos(s, p))) {
        food = p;
        return;
      }
    }
  }

  function reset() {
    score = 0;
    scoreEl.textContent = "0";
    paused = false;

    const start = { x: Math.floor(cells / 2), y: Math.floor(cells / 2) };
    snake = [
      { x: start.x - 1, y: start.y },
      { x: start.x, y: start.y },
      { x: start.x + 1, y: start.y }
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    placeFood();
  }

  function gameOver() {
    paused = true;
    if (score > best) {
      best = score;
      localStorage.setItem("snake_best", best);
      bestEl.textContent = best;
    }
  }

  function setDir(nx, ny) {
    if (dir.x === -nx && dir.y === -ny) return;
    nextDir = { x: nx, y: ny };
  }

  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowUp") setDir(0, -1);
    if (e.key === "ArrowDown") setDir(0, 1);
    if (e.key === "ArrowLeft") setDir(-1, 0);
    if (e.key === "ArrowRight") setDir(1, 0);
    if (e.key === " ") paused = !paused;
    if (e.key.toLowerCase() === "r") reset();
  });

  function step() {
    dir = nextDir;
    const head = snake[snake.length - 1];
    const newHead = { x: (head.x + dir.x + cells) % cells, y: (head.y + dir.y + cells) % cells };

    if (snake.some(seg => samePos(seg, newHead))) {
      gameOver();
      return;
    }

    snake.push(newHead);

    if (samePos(newHead, food)) {
      score++;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.shift();
    }
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * size + 2, y * size + 2, size - 4, size - 4);
  }

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawCell(food.x, food.y, "#ffcf5a");
    snake.forEach((seg, i) => drawCell(seg.x, seg.y, i === snake.length - 1 ? "#7ee787" : "#2ea043"));
  }

  function loop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = (ts - lastTime) / 1000;
    lastTime = ts;

    const stepTime = 1 / baseSpeed;

    if (!paused) {
      accumulator += dt;
      while (accumulator >= stepTime) {
        step();
        accumulator -= stepTime;
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
